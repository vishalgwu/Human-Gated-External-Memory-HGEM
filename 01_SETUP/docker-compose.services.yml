services:
  postgres:
    image: postgres:15
    container_name: hgem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hgem_research}
      POSTGRES_USER: ${POSTGRES_USER:-hgem_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hgem_postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hgem_postgres_data:/var/lib/postgresql/data
      - ../03_SYSTEM/database/postgresql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hgem_app} -d ${POSTGRES_DB:-hgem_research}"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: hgem_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-hgem_neo4j_password}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - hgem_neo4j_data:/data
      - hgem_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: hgem_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - hgem_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hgem_postgres_data:
  hgem_neo4j_data:
  hgem_neo4j_logs:
  hgem_redis_data:
